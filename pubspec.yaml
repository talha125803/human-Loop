name: humanity_loop
description: "A real-world self-improvement game focused on meaningful human growth"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Functional Programming
  fpdart: ^1.1.0
  freezed_annotation: ^2.4.4

  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # Backend & Auth
  supabase_flutter: ^2.5.6

  # Navigation
  go_router: ^14.2.7

  # UI Components
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  lottie: ^3.1.2
  shimmer: ^3.0.0
  flutter_svg: ^2.0.10+1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.2
  equatable: ^2.0.5
  json_annotation: ^4.9.0

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Image & Media
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # Analytics & Monitoring
  firebase_core: ^3.4.1
  firebase_analytics: ^11.3.1
  firebase_crashlytics: ^4.1.1

  # Permissions
  permission_handler: ^11.3.1

  # Connectivity
  connectivity_plus: ^6.0.5

  # Device Info
  device_info_plus: ^10.1.2
  package_info_plus: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/logo.png

dependency_overrides:
  analyzer: '6.4.1'

